# MirApay production stack.
#
# Compose reads ${...} values from the file passed with --env-file, not from
# env_file below, so always start with:
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# The dockpod-proxy network must exist first. On a local machine, create it once:
#
#   docker network create dockpod-proxy

name: mirapay

# Service hostnames are fixed on purpose: they address the compose network.
# DB credentials come from the same interpolation as the mysql service, so the
# app and the database can never disagree.
x-app-environment: &app-environment
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env.production}
  DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env.production}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}

# Shared by app/queue/scheduler. Only the app service declares `build`, so the
# image is built once; pull_policy stops Compose from trying to pull the local
# tag from Docker Hub.
x-app: &app
  image: mirapay-app:latest
  pull_policy: never
  restart: unless-stopped
  env_file:
    - path: .env.production
      required: false
  environment:
    <<: *app-environment
  volumes:
    - storage-public:/var/www/html/storage/app/public
    - storage-logs:/var/www/html/storage/logs
  depends_on:
    mysql:
      condition: service_healthy
  networks:
    - internal

services:
  app:
    <<: *app
    build:
      context: .
      target: app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 60s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: mirapay-web:latest
    pull_policy: never
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      # Not 80: Traefik owns that port on the DockPod host.
      - "${APP_PORT:-8001}:80"
    volumes:
      - storage-public:/var/www/html/public/storage:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
      # Traefik reaches nginx over this shared network.
      - dockpod-proxy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env.production}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.production}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

volumes:
  mysql-data:
  storage-public:
  storage-logs:

networks:
  internal:

  # Created by DockPod on the deploy host, where Traefik is attached to it.
  dockpod-proxy:
    external: true
