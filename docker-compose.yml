# MirApay production stack: nginx + PHP-FPM + queue worker + MySQL.
#
# No .env file is used. Every ${VAR} below is supplied by the deploy platform
# (set them in its Environment Variables screen). Values marked with :? are
# required and the deploy fails fast if they are missing.
#
# APP_KEY is optional: when it is empty the app container generates one on
# first boot and keeps it on the storage-private volume. Pin it on the
# platform afterwards (docker compose exec app cat storage/app/private/.app-key).

name: mirapay

# Passed into the app and queue containers. Hostnames for the compose network
# (DB_HOST) are fixed on purpose; the DB credentials reuse the same variables
# as the mysql service, so the app and the database can never disagree.
x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-MirApay}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:?APP_URL is required}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}

  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-warning}

  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  CACHE_STORE: ${CACHE_STORE:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}

  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MirApay}

  PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-manual}
  STRIPE_SECRET: ${STRIPE_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_CURRENCY: ${STRIPE_CURRENCY:-myr}

  # Empty means "use APP_KEY"; the entrypoint fills it in.
  PASSKEYS_USER_HANDLE_SECRET: ${PASSKEYS_USER_HANDLE_SECRET:-}

x-app: &app
  build:
    context: .
    target: app
  image: mirapay-app:latest
  restart: unless-stopped
  environment:
    <<: *app-environment
  volumes:
    - storage-public:/var/www/html/storage/app/public
    # Holds the generated APP_KEY; app and queue must share it.
    - storage-private:/var/www/html/storage/app/private
    - storage-logs:/var/www/html/storage/logs
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Sends the queued order/payment emails.
  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 60s

  nginx:
    build:
      context: .
      target: web
    image: mirapay-web:latest
    restart: unless-stopped
    # The platform's proxy routes the domain to this container on port 80.
    # Set APP_PORT only if the platform needs a published host port.
    expose:
      - "80"
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Uploads are served straight from the shared volume, no storage:link needed.
      - storage-public:/var/www/html/public/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
  storage-public:
  storage-private:
  storage-logs:
