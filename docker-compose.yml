# MirApay production stack for DockPod.
#
# Every value is read from the environment set on the DockPod platform, never
# from a .env file. Everything has a default so the stack boots unattended,
# except the database passwords: DB_PASSWORD and MYSQL_ROOT_PASSWORD must be
# set on the platform, so no credential is ever committed here.
#
# APP_KEY may be left empty: the app container generates one on first boot
# and keeps it at storage/app/private/.app-key on the storage mount. Pin it on
# the platform afterwards so it survives the storage directory being reset.

name: mirapay

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-MirApay}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-https://mirapay.dockpod.dev}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
  APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}

  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}

  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_STACK: ${LOG_STACK:-single}
  LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
  LOG_LEVEL: ${LOG_LEVEL:-warning}

  # Service hostnames are fixed on purpose: they address the compose network
  # and must not be overridable by a stray host-side value.
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-mirapay}
  DB_USERNAME: ${DB_USERNAME:-mirapay}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD on the platform}

  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
  SESSION_PATH: ${SESSION_PATH:-/}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-null}

  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  CACHE_STORE: ${CACHE_STORE:-database}

  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-null}
  MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
  MAIL_PORT: ${MAIL_PORT:-2525}
  MAIL_USERNAME: ${MAIL_USERNAME:-null}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-${APP_NAME:-MirApay}}

  PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-manual}
  STRIPE_SECRET: ${STRIPE_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_CURRENCY: ${STRIPE_CURRENCY:-myr}

  # Empty means "use APP_KEY"; the entrypoint fills it in.
  PASSKEYS_USER_HANDLE_SECRET: ${PASSKEYS_USER_HANDLE_SECRET:-}

  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_BUCKET: ${AWS_BUCKET:-}
  AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}

# Shared by app/queue/scheduler. Only the app service declares `build`, so the
# image is produced exactly once; building the same tag from three services in
# parallel makes BuildKit race on the export.
x-app-service: &app-service
  image: ${APP_IMAGE:-mirapay-app:latest}
  pull_policy: never
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  volumes:
    - ${STORAGE_PATH:-/data/mirapay/storage}:/var/www/html/storage
  networks:
    - mirapay

# queue and scheduler start only once app is healthy, so app alone generates
# APP_KEY on first boot and they read the same key back from storage.
x-after-app: &after-app
  depends_on:
    mysql:
      condition: service_healthy
    app:
      condition: service_healthy

services:
  # nginx terminates HTTP, serves public/ and proxies PHP to the app service.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ${WEB_IMAGE:-mirapay-web:latest}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Not 80: Traefik owns that port on the DockPod host.
      - "${APP_PORT:-8001}:80"
    volumes:
      # Read-only: nginx serves user uploads from here but never writes them.
      - ${STORAGE_PATH:-/data/mirapay/storage}:/var/www/html/storage:ro
    networks:
      - mirapay
      # Traefik reaches nginx over this shared network. Without it the proxy
      # has no route to the container and requests hang at the edge.

  # PHP-FPM. Not published; only nginx talks to it, over the compose network.
  app:
    <<: *app-service
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    environment:
      <<: *app-environment
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-false}

  # Sends the queued order/payment emails.
  queue:
    <<: [*after-app, *app-service]
    environment:
      <<: *app-environment
      CONTAINER_ROLE: queue
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    # Overrides the image's PHP-FPM check: this container runs a worker.
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "default"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  scheduler:
    <<: [*after-app, *app-service]
    environment:
      <<: *app-environment
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    # No meaningful liveness probe for a scheduler loop.
    healthcheck:
      disable: true

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD on the platform}
      MYSQL_DATABASE: ${DB_DATABASE:-mirapay}
      MYSQL_USER: ${DB_USERNAME:-mirapay}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD on the platform}
      TZ: ${DB_TIMEZONE:-UTC}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ${MYSQL_DATA_PATH:-/data/mirapay/mysql}:/var/lib/mysql
    ports:
      # Bound to loopback so the database is never published to the world.
      # 3307, not 3306: eventmu's MySQL already holds 3306 on the DockPod host.
      - "${DB_FORWARD_PORT:-127.0.0.1:3307}:3306"
    healthcheck:
      # $$ defers expansion to the container, keeping the password out of the config.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mirapay

networks:
  mirapay:
    driver: bridge

  # Created by DockPod on the deploy host, where Traefik is attached to it.
  # For a local run, create it once first:
  #   docker network create dockpod-proxy
