[www]
; PHP-FPM strips the parent environment by default, which would hide every
; value docker compose passes in (DB_PASSWORD, gateway credentials, ...).
clear_env = no

listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Logs go to the container's stdout/stderr for `docker compose logs`.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
