server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Matches upload_max_filesize/post_max_size in docker/php.ini.
    client_max_body_size 40M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # Filtered on Content-Type, including responses PHP streams: Flux serves
    # its JS as text/javascript, the sitemap as application/xml and calendar
    # invitations as text/calendar.
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json text/calendar image/svg+xml image/x-icon;

    # Neither file has to exist on disk: robots.txt is a Laravel route, and
    # without the fallback nginx answers its own 404 (kept by error_page
    # below even though Laravel then renders the body).
    location = /favicon.ico { try_files $uri /index.php?$query_string; access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; access_log off; log_not_found off; }

    # Vite output is content-hashed, so it can be cached indefinitely.
    location /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # User uploads. Served straight off the shared storage volume rather than
    # through the public/storage symlink, which only exists in the app image.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Resolved per request through Docker's embedded DNS so that a
        # restarted app container does not leave nginx on a stale address.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream app:9000;

        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
