[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Health check endpoint for Docker.
ping.path = /fpm-ping

; Keep the environment the platform injects into the container.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
